[project]
name = "moe-export"
version = "0.1.0"
description = "Token-Theater-Werkzeuge: MoE-Traces (SPEC-0011), Sonden und Gewichtsabgleich (SPEC-0012)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "transformers>=4.46",
  "safetensors>=0.4",
  "jsonschema>=4.23",
  "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
